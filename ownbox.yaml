schema: 1
name: track
description: Give it an assignment, it hunts down who sells that cheap and where, then keeps watching.
homepage: https://github.com/BogdanStamenovic/track
tags: [deals, scraper, scheduler, web, cli, python]

# Ownbox drives deploy/ rather than carrying a second, parallel install path, so
# `ownbox install track` and a manual `bash deploy/install.sh` do the same thing.
# The setup script asks whether to serve the web view, on which port, and
# whether to bind 0.0.0.0 or localhost; with no terminal it takes the documented
# defaults instead of blocking, because ownbox's command timeout is 1800s and a
# hung prompt would burn all of it. Every answer has an environment-variable override
# (TRACK_WEB, TRACK_WEB_PORT, TRACK_WEB_BIND) so it is scriptable too.
install:
  platforms: [linux]
  setup:
    linux:
      - bash deploy/install.sh
  update:
    linux:
      - bash deploy/update.sh
  remove:
    linux:
      - bash deploy/uninstall.sh
command:
  linux: .venv/bin/track
