# Paths the installer and uninstaller must agree on. Sourced by both.
# tests/test_web_deploy.py asserts they stay in step with the scripts.

SERVICE_NAME="track-web.service"
UNIT_DIR="${XDG_CONFIG_HOME:-$HOME/.config}/systemd/user"
UNIT_FILE="${UNIT_DIR}/${SERVICE_NAME}"

CONFIG_DIR="${XDG_CONFIG_HOME:-$HOME/.config}/track"
ENV_FILE="${CONFIG_DIR}/web.env"

# The findings database. Removed only by `uninstall.sh --purge`: it is the
# result of every run ever made and is not the installer's to throw away.
DATA_DIR="${XDG_DATA_HOME:-$HOME/.local/share}/track"

DEFAULT_PORT=8791
