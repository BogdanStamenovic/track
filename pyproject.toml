[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "track"
version = "0.1.0"
description = "Give it an assignment, it hunts down who sells that cheap and where, then keeps watching."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Bogdan Stamenovic" }]
keywords = ["deals", "scraper", "scheduler", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<10",
  "pytest-cov>=5.0,<7",
  "ruff>=0.6,<1",
  "mypy>=1.11,<3",
]

[project.scripts]
track = "track.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/track"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# PYI034 wants `Self`, which needs typing_extensions on 3.10; not worth a dependency for this.
ignore = ["PYI034"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true
